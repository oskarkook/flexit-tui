name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            name="flexit-${VERSION}-${goos}-${goarch}"
            ext=""
            [ "$goos" = windows ] && ext=".exe"
            mkdir "dist/$name"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags="-s -w" -o "dist/$name/flexit$ext" ./cmd/flexit
            cp README.md "dist/$name/"
            if [ "$goos" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: release
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Point the manifest at this release
        run: |
          sed -i -E "s/^([[:space:]]*)tag: v.*/\1tag: ${GITHUB_REF_NAME}/" flatpak/io.github.oskarkook.FlexitTui.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: flexit-${{ github.ref_name }}-linux-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.oskarkook.FlexitTui.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ github.ref_name }}
          artifact-name: flexit-${{ github.ref_name }}-linux-${{ matrix.arch }}

  publish-flatpak:
    name: Publish Flatpak bundles
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: flexit-*-linux-*
          path: dist
          merge-multiple: true

      - name: Add bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir dist
          (cd dist && sha256sum *.flatpak >> checksums.txt)
          gh release upload "$GITHUB_REF_NAME" dist/*.flatpak dist/checksums.txt --clobber
